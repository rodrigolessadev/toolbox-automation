version: 1

protected_patterns:
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"
  - "**/*.pfx"
  - "**/secrets/**"
  - "**/credentials/**"

private_plugins:
  - "plugins/release/**"

rules:
  read: blocked
  display: blocked
  copy: blocked
  commit: blocked
  external_upload: blocked
  marketplace_publish: blocked
