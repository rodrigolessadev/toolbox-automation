version: 1

projects:
  toolbox-automation:
    path: "C:/tools/toolbox-automation"
    role: automation
    required: true

  toolbox:
    path: "C:/tools/toolbox"
    role: product
    required: true

  toolbox-plugins:
    path: "C:/tools/toolbox-plugins"
    role: plugins
    required: true

  release-plugin:
    path: "C:/tools/toolbox-plugins/plugins/release"
    role: internal_tool
    required: false

authorized_roots:
  - "C:/tools/toolbox-automation"
  - "C:/tools/toolbox"
  - "C:/tools/toolbox-plugins"

protected_patterns:
  - "**/.env"
  - "**/.env.*"
  - "**/*.key"
  - "**/*.pem"
  - "**/*.p12"
  - "**/*.pfx"
  - "**/secrets/**"
  - "**/credentials/**"

local_only:
  - config/local-projects.yaml
  - ".agent/local/**"
  - ".agent/runtime/**"
  - ".agent/checkpoints/**"

validation:
  check_git_repository: true
  check_clean_start: false
  check_required_files: true
  check_protected_paths: true
