<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PLUGIN_NAME}} — Toolbox</title>
  <link rel="stylesheet" href="toolbox-theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Top Header & Tabs -->
    <header class="app-header">
      <div class="brand-section">
        <span class="brand-icon" data-icon="{{PLUGIN_ICON}}"></span>
        <span class="brand-title">{{PLUGIN_NAME}}</span>
        <span id="versionBadge" class="badge badge-accent">v1.0.0</span>
      </div>

      <div class="header-tabs-container">
        <div class="tab-item active">
          <span data-icon="{{PLUGIN_ICON}}"></span>
          <span>Painel Principal</span>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="btnThemeToggle" onclick="toggleTheme()" title="Alternar Tema Claro / Escuro">
          <span data-icon="sun" id="themeIcon"></span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <section class="card">
        <div class="card-title">
          <span data-icon="plus"></span> Novo Item
        </div>
        <div class="form-row">
          <input
            type="text"
            id="itemInput"
            class="input"
            placeholder="Digite o título do item..."
            autocomplete="off"
          />
          <button type="button" class="btn btn-primary" onclick="handleAddItem()">
            <span data-icon="plus"></span> Adicionar
          </button>
        </div>
      </section>

      <section class="card">
        <div class="card-title">
          <span data-icon="{{PLUGIN_ICON}}"></span> Itens Cadastrados (<span id="itemsCount">0</span>)
        </div>
        <div class="items-list" id="itemsContainer">
          <!-- Itens renderizados aqui dinamicamente -->
        </div>
      </section>
    </main>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
